name: Aggiorna orari

on:
  schedule:
    - cron: '23 1 * * 2,4,6'
      timezone: Europe/Rome
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-timetables
  cancel-in-progress: false

jobs:
  update-timetables:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      air_outcome: ${{ steps.air.outcome }}
      mottam_outcome: ${{ steps.mottam.outcome }}
      eav_outcome: ${{ steps.eav.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-timetables.txt
      - name: Installa dipendenze
        run: python -m pip install -r scripts/requirements-timetables.txt
      - name: Test parser e regole
        run: python -m unittest discover -s tests -v
      - name: Controlla gli orari AIR dal PDF ufficiale
        id: air
        continue-on-error: true
        run: python scripts/check_air_timetables.py --apply
      - name: Controlla gli orari MOT.TAM dalla pagina ufficiale
        id: mottam
        continue-on-error: true
        run: python scripts/check_mottam_timetables.py --apply
      - name: Controlla gli orari EAV dal PDF ufficiale
        id: eav
        continue-on-error: true
        run: python scripts/check_eav_timetables.py --apply
      - name: Verifica coerenza dei dati generati
        run: |
          python scripts/generate_data.py
          python -m unittest discover -s tests -v
      - name: Commit degli orari aggiornati
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/timetables/orari_eav_air.csv assets/timetables/orari_mottam.csv assets/timetables/line_updates.json data.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: aggiorna o conferma gli orari"
            git push origin "HEAD:$DEFAULT_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Riepilogo del controllo
        if: always()
        shell: bash
        run: |
          if [ -f tmp/air-check/report.md ]; then
            cat tmp/air-check/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f tmp/mottam-check/report.md ]; then
            cat tmp/mottam-check/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f tmp/eav-check/report.md ]; then
            cat tmp/eav-check/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Salva fonte, report e file proposti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-reports
          path: |
            tmp/air-check/
            tmp/mottam-check/
            tmp/eav-check/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: update-timetables
    if: needs.update-timetables.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  source-status:
    needs: [update-timetables, publish]
    if: >-
      always() && needs.update-timetables.result == 'success' &&
      (needs.update-timetables.outputs.air_outcome != 'success' ||
       needs.update-timetables.outputs.mottam_outcome != 'success' ||
       needs.update-timetables.outputs.eav_outcome != 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Segnala le fonti non verificate
        env:
          AIR_OUTCOME: ${{ needs.update-timetables.outputs.air_outcome }}
          MOTTAM_OUTCOME: ${{ needs.update-timetables.outputs.mottam_outcome }}
          EAV_OUTCOME: ${{ needs.update-timetables.outputs.eav_outcome }}
        run: |
          echo "::error::Esito controllo AIR: $AIR_OUTCOME; MOT.TAM: $MOTTAM_OUTCOME; EAV: $EAV_OUTCOME. Consultare i report."
          exit 1
