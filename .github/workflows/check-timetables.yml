name: Aggiorna orari AIR

on:
  schedule:
    # Domenica: 04:23 UTC, quindi prima dell'inizio della settimana lavorativa.
    - cron: '23 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-timetables-air
  cancel-in-progress: false

jobs:
  check-air:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-timetables.txt
      - name: Installa parser PDF
        run: python -m pip install -r scripts/requirements-timetables.txt
      - name: Test parser e regole
        run: python -m unittest discover -s tests -v
      - name: Trova il PDF attuale e confronta gli orari
        run: python scripts/check_air_timetables.py --apply
      - name: Verifica coerenza dei dati generati
        run: |
          python scripts/generate_data.py
          python -m unittest discover -s tests -v
      - name: Commit degli orari aggiornati
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/timetables/orari_eav_air.csv data.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: aggiorna automaticamente gli orari AIR"
            git push origin "HEAD:$DEFAULT_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Riepilogo del controllo
        if: always()
        shell: bash
        run: |
          if [ -f tmp/air-check/report.md ]; then
            cat tmp/air-check/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Salva fonte, report e file proposti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: air-timetable-review
          path: tmp/air-check/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: check-air
    if: needs.check-air.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
