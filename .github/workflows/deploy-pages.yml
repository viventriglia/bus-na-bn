name: Pubblica sito

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - data.js
      - styles.css
      - assets/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Include l'eventuale commit appena creato dal controllo AIR.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - name: Prepara i file pubblici
        run: |
          mkdir _site
          cp index.html app.js data.js styles.css _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
