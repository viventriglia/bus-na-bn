<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f6b4d">
    <title>BN NA Bus</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <h1 id="pageTitle">Quando vedrai il Vesuvio?</h1>
        </div>
        <div class="header-actions">
          <button class="theme-toggle" type="button" id="themeToggle" aria-pressed="false" aria-label="Attiva tema scuro">
            <span class="theme-icon sun-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
              </svg>
            </span>
            <span class="theme-icon moon-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M20.6 14.6A8.2 8.2 0 0 1 9.4 3.4a8.7 8.7 0 1 0 11.2 11.2Z"></path>
              </svg>
            </span>
            <span class="sr-only" id="themeToggleLabel">Attiva tema scuro</span>
          </button>
          <p id="dataStatus" class="status" aria-live="polite">Caricamento</p>
        </div>
      </header>

      <section class="search-panel" aria-labelledby="searchTitle">
        <div class="search-panel-header">
          <h2 id="searchTitle">Filtra corse</h2>
          <button class="secondary-button compact-button" type="button" id="resetSearch">Reset filtri</button>
        </div>
        <form id="searchForm" class="search-form">
          <div class="field">
            <label for="fromStop">Partenza</label>
            <select id="fromStop" name="fromStop" required></select>
          </div>

          <button class="swap-button" type="button" id="swapStops" aria-label="Inverti partenza e arrivo" title="Inverti">
            <span aria-hidden="true">&harr;</span>
          </button>

          <div class="field">
            <label for="toStop">Arrivo</label>
            <select id="toStop" name="toStop" required></select>
          </div>

          <div class="field time-field">
            <span class="field-label">Orario</span>
            <div class="time-filter">
              <div class="time-mode" role="radiogroup" aria-label="Tipo filtro orario">
                <label class="time-mode-option">
                  <input type="radio" name="timeMode" value="departure" checked>
                  <span>Partenza dalle</span>
                </label>
                <label class="time-mode-option">
                  <input type="radio" name="timeMode" value="arrival">
                  <span>Arrivo entro</span>
                </label>
              </div>
              <input id="timeFrom" name="timeFrom" type="time" aria-label="Partenza dalle" required>
            </div>
          </div>
        </form>
      </section>

      <section class="results-section" aria-labelledby="resultsTitle">
        <div class="results-heading">
          <h2 id="resultsTitle">Risultati</h2>
          <p id="resultsSummary" class="summary" aria-live="polite"></p>
        </div>
        <div id="results" class="results"></div>
      </section>

      <footer class="app-footer">Built with 💙 by Bubu for Dudu</footer>
    </main>

    <script src="data.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
